# Publishes the units UI to GitHub Pages.
#
# The app is a fully static bundle — the game database ships as a committed
# snapshot and player data is imported in the browser — so there is nothing to
# run server-side.
#
# Enable this once under Settings -> Pages -> "Build and deployment" ->
# Source: GitHub Actions. Until then the workflow can be run manually and will
# simply produce an artifact.
name: Deploy UI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ui/**'
      - 'src/**'
      - '.github/workflows/deploy-ui.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: |
          npm ci
          npm --prefix ui ci
      - name: Build
        # BASE_PATH matches the project-site sub-path GitHub Pages serves from.
        run: npm --prefix ui run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ui/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
